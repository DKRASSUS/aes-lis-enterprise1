<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES O.S. - Admisión y Órdenes LIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --aes-blue: #00A8E8;
            --aes-dark: #1A1A24;
            --aes-purple: #6B21A8; 
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --border-color: #E2E8F0;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: var(--text-main); }
        .topbar { background-color: var(--aes-dark); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        
        .container { max-width: 1300px; margin: 30px auto; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; padding: 0 20px; }
        .panel { background: var(--card-bg); border-radius: 8px; border-top: 4px solid var(--aes-blue); box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 20px; }
        .panel-title { font-size: 1.1rem; font-weight: 800; margin-top: 0; margin-bottom: 20px; color: var(--aes-dark); text-transform: uppercase; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-family: 'Inter', sans-serif; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--aes-blue); }
        
        .search-box { display: flex; gap: 10px; }
        button { background-color: var(--aes-blue); color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0089bd; }
        
        .btn-success { background-color: #10B981; width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 20px; }
        .btn-success:hover { background-color: #059669; }
        .btn-print { background-color: #3B82F6; margin-top: 15px; width: 100%; font-size: 1rem; padding: 12px;}

        /* Historial */
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .history-table th, .history-table td { padding: 8px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .history-table th { background: #F1F5F9; color: #555; }

        /* Botones de Categorías LIS */
        .category-btn { width: 100%; background-color: #F8FAFC; color: var(--aes-dark); border: 2px solid var(--border-color); padding: 15px; font-size: 1rem; text-align: left; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .category-btn:hover { border-color: var(--aes-purple); background-color: #F3E8FF; color: var(--aes-purple); }
        
        /* Resumen de Pruebas Seleccionadas */
        #resumen-seleccion { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .badge-prueba { background-color: var(--aes-purple); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

        /* VENTANA EMERGENTE (MODAL) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 95%; max-width: 1100px; max-height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { padding: 20px; background: var(--aes-dark); color: white; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .btn-close { background: transparent; color: white; font-size: 1.5rem; padding: 0; margin: 0; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; }
        .btn-close:hover { background: rgba(255,255,255,0.2); }
        
        .modal-body { padding: 20px; overflow-y: auto; background: #F8FAFC; }
        
        /* Cuadritos Blancos de Pruebas */
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .test-card { background: white; border: 2px solid var(--border-color); border-radius: 8px; padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 75px; user-select: none; }
        .test-card .test-code { font-weight: 800; font-size: 1.1rem; color: var(--aes-dark); }
        .test-card .test-name { font-size: 0.7rem; color: #666; margin-top: 5px; line-height: 1.2; }
        
        .test-card.selected { background-color: var(--aes-purple); border-color: var(--aes-purple); box-shadow: 0 4px 10px rgba(107, 33, 168, 0.3); transform: translateY(-2px); }
        .test-card.selected .test-code, .test-card.selected .test-name { color: white; }

        .modal-footer { padding: 15px 20px; background: white; border-top: 1px solid var(--border-color); text-align: right; }
        .btn-save-modal { background: var(--aes-purple); font-size: 1rem; }
        .btn-save-modal:hover { background: #581C87; }

        .barcode-container { text-align: center; padding: 20px; background: #F8FAFC; border: 2px dashed #CBD5E1; border-radius: 8px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="topbar">
        <h2>AES <span>O.S. Enterprise</span> - Central de Admisión</h2>
        <span id="reloj" style="font-weight: 600; color: #C2E778;"></span>
    </div>

    <div class="container">
        <!-- COLUMNA IZQUIERDA -->
        <div>
            <div class="panel">
                <h3 class="panel-title">1. Búsqueda y Registro Demográfico</h3>
                <div class="form-group">
                    <label>Carnet de Identidad</label>
                    <div class="search-box">
                        <input type="text" id="ci" placeholder="Ingrese CI para buscar o registrar">
                        <button onclick="buscarPaciente()">🔍 Buscar LIS</button>
                    </div>
                </div>
                <div class="form-group"><label>Nombre Completo</label><input type="text" id="nombre"></div>
                <div class="form-row">
                    <div class="form-group"><label>Fecha de Nacimiento</label><input type="date" id="fecha_nac"></div>
                    <div class="form-group"><label>Género</label>
                        <select id="genero"><option value="M">Masculino</option><option value="F">Femenino</option></select>
                    </div>
                </div>
            </div>

            <div class="panel" id="panel-historial" style="display: none;">
                <h3 class="panel-title">Historial de Exámenes</h3>
                <table class="history-table">
                    <thead><tr><th>Fecha</th><th>Médico</th><th>Pruebas</th><th>Estado</th></tr></thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
        </div>

        <!-- COLUMNA DERECHA -->
        <div>
            <div class="panel order-panel">
                <h3 class="panel-title">2. Orden de Laboratorio</h3>
                <div class="form-row">
                    <div class="form-group"><label>Médico Solicitante</label><input type="text" id="medico"></div>
                    <div class="form-group"><label>Prioridad</label>
                        <select id="prioridad"><option value="Rutina">Rutina</option><option value="Urgencia">Urgencia (STAT)</option></select>
                    </div>
                </div>

                <label style="margin-top: 10px; margin-bottom: 10px;">Selección de Paneles LIS (Click para abrir)</label>
                
                <button class="category-btn" onclick="abrirModal('quimica')">🧪 Química Sanguínea, TDM y Drogas <span>+</span></button>
                <button class="category-btn" onclick="abrirModal('inmunologia')">🧬 Inmunología y Hormonas <span>+</span></button>
                <button class="category-btn" onclick="abrirModal('infecciosas')">🦠 Serología e Infecciosas <span>+</span></button>
                <button class="category-btn" onclick="abrirModal('marcadores')">🎗️ Marcadores Tumorales <span>+</span></button>
                <button class="category-btn" onclick="abrirModal('hematologia')">🩸 Hematología <span>+</span></button>
                <button class="category-btn" onclick="abrirModal('coagulacion')">⏱️ Coagulación y Factores <span>+</span></button>

                <div id="resumen-seleccion"></div>

                <button class="btn-success" onclick="generarOrden()">Generar Orden LIS</button>
            </div>

            <div class="panel barcode-container" id="barcode-panel">
                <h3 class="panel-title" style="border: none; margin-bottom: 5px;">Etiqueta Generada</h3>
                <p style="font-size: 0.85rem; color: #555; margin-bottom: 15px;" id="lbl-paciente-etiqueta"></p>
                <svg id="barcode"></svg>
                <button class="btn-print" onclick="window.print()">🖨️ Imprimir Etiqueta para Tubo</button>
            </div>
        </div>
    </div>

    <!-- VENTANA EMERGENTE (MODAL) -->
    <div class="modal-overlay" id="modal-pruebas">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Seleccionar Pruebas</h3>
                <button class="btn-close" onclick="cerrarModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="test-grid" id="modal-grid"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-save-modal" onclick="cerrarModal()">Confirmar Selección</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://lis-aes-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        setInterval(() => { document.getElementById('reloj').innerText = new Date().toLocaleString(); }, 1000);

        // --- DICCIONARIO TITÁN DE PRUEBAS ---
        const catalogoPruebas = {
            quimica: [
                { id: "GLU", nombre: "Glucosa" }, { id: "UREA", nombre: "Urea" }, { id: "BUN", nombre: "Nitrógeno Ureico" },
                { id: "CREA", nombre: "Creatinina" }, { id: "URI", nombre: "Ácido Úrico" }, { id: "COL", nombre: "Colesterol Total" },
                { id: "TRIG", nombre: "Triglicéridos" }, { id: "HDL", nombre: "Colesterol HDL" }, { id: "LDL", nombre: "Colesterol LDL" },
                { id: "VLDL", nombre: "Colesterol VLDL" }, { id: "LIPA", nombre: "Lipoproteína (a)" }, { id: "APOA1", nombre: "Apolipoproteína A1" },
                { id: "APOB", nombre: "Apolipoproteína B" }, { id: "AST", nombre: "AST / GOT" }, { id: "ALT", nombre: "ALT / GPT" }, 
                { id: "ALP", nombre: "Fosfatasa Alcalina" }, { id: "GGT", nombre: "Gamma GT" }, { id: "LDH", nombre: "Lactato Deshidrogenasa" }, 
                { id: "BT", nombre: "Bilirrubina Total" }, { id: "BD", nombre: "Bilirrubina Directa" }, { id: "BI", nombre: "Bilirrubina Indirecta" },
                { id: "PT", nombre: "Proteínas Totales" }, { id: "ALB", nombre: "Albúmina" }, { id: "GLOB", nombre: "Globulinas" },
                { id: "CA", nombre: "Calcio Total" }, { id: "CAI", nombre: "Calcio Iónico" }, { id: "P", nombre: "Fósforo" }, 
                { id: "MG", nombre: "Magnesio" }, { id: "FE", nombre: "Hierro Sanguíneo" }, { id: "TIBC", nombre: "Capacidad Fijación Fe" },
                { id: "NA", nombre: "Sodio (Na+)" }, { id: "K", nombre: "Potasio (K+)" }, { id: "CL", nombre: "Cloro (Cl-)" },
                { id: "AMIL", nombre: "Amilasa" }, { id: "LIP", nombre: "Lipasa" }, { id: "HBA1C", nombre: "Hemoglobina A1c" },
                { id: "PCR", nombre: "Proteína C Reactiva" }, { id: "ASO", nombre: "Antiestreptolisina O" }, { id: "FR", nombre: "Factor Reumatoide" },
                { id: "C3", nombre: "Complemento C3" }, { id: "C4", nombre: "Complemento C4" }, { id: "IGA", nombre: "Inmunoglobulina A" },
                { id: "IGG", nombre: "Inmunoglobulina G" }, { id: "IGM", nombre: "Inmunoglobulina M" }, { id: "DIG", nombre: "Digoxina" },
                { id: "VAL", nombre: "Ácido Valproico" }, { id: "FEN", nombre: "Fenitoína" }, { id: "CBZ", nombre: "Carbamazepina" }
            ],
            inmunologia: [
                { id: "TSH", nombre: "Hormona TSH" }, { id: "FT4", nombre: "T4 Libre" }, { id: "FT3", nombre: "T3 Libre" },
                { id: "T4", nombre: "T4 Total" }, { id: "T3", nombre: "T3 Total" }, { id: "ATPO", nombre: "Anti-TPO" },
                { id: "ATG", nombre: "Anti-Tiroglobulina" }, { id: "TRAB", nombre: "Anti-Receptor TSH" }, { id: "FSH", nombre: "Hormona FSH" }, 
                { id: "LH", nombre: "Hormona LH" }, { id: "PRL", nombre: "Prolactina" }, { id: "E2", nombre: "Estradiol" }, 
                { id: "E3", nombre: "Estriol Libre" }, { id: "PRG", nombre: "Progesterona" }, { id: "TESTO", nombre: "Testosterona Total" }, 
                { id: "TESTL", nombre: "Testosterona Libre" }, { id: "SHBG", nombre: "Globulina Fijadora Sex." }, { id: "BHCG", nombre: "Beta-hCG Cuantitativa" }, 
                { id: "AMH", nombre: "Hormona Antimülleriana" }, { id: "CORT", nombre: "Cortisol (Sérico)" }, { id: "ACTH", nombre: "Hormona ACTH" }, 
                { id: "PTH", nombre: "Paratohormona Intacta" }, { id: "INS", nombre: "Insulina" }, { id: "CPEP", nombre: "Péptido C" },
                { id: "FERR", nombre: "Ferritina" }, { id: "VITD", nombre: "Vitamina D (25-OH)" }, { id: "VITB12", nombre: "Vitamina B12" },
                { id: "FOL", nombre: "Ácido Fólico" }, { id: "TROP", nombre: "Troponina I Alta Sens." }, { id: "PROBNP", nombre: "NT-proBNP" },
                { id: "CKMB", nombre: "CK-MB Masa" }, { id: "MYO", nombre: "Mioglobina" }, { id: "PCT", nombre: "Procalcitonina" },
                { id: "IGE", nombre: "IgE Total" }, { id: "ANA", nombre: "Anticuerpos ANA" }, { id: "ADN", nombre: "Anti-DNA dc" }
            ],
            infecciosas: [
                { id: "HBSAG", nombre: "Antígeno de Sup. Hep B" }, { id: "AHBS", nombre: "Ac. Anti-HBs" }, { id: "AHBC", nombre: "Ac. Anti-HBc Total" },
                { id: "AHBCM", nombre: "Ac. Anti-HBc IgM" }, { id: "HBEAG", nombre: "Antígeno HBe" }, { id: "AHBE", nombre: "Ac. Anti-HBe" },
                { id: "HCV", nombre: "Anticuerpos Hep C" }, { id: "HAVM", nombre: "Hep A IgM" }, { id: "HIV", nombre: "VIH Ag/Ab Combo" },
                { id: "SYPH", nombre: "Sífilis (Treponema)" }, { id: "CHAGAS", nombre: "Chagas IgG/IgM" }, { id: "TOXOG", nombre: "Toxoplasma IgG" }, 
                { id: "TOXOM", nombre: "Toxoplasma IgM" }, { id: "RUBG", nombre: "Rubéola IgG" }, { id: "RUBM", nombre: "Rubéola IgM" }, 
                { id: "CMVG", nombre: "Citomegalovirus IgG" }, { id: "CMVM", nombre: "Citomegalovirus IgM" }, { id: "HSV1G", nombre: "Herpes I IgG" }, 
                { id: "HSV2G", nombre: "Herpes II IgG" }, { id: "DENG", nombre: "Dengue NS1 Ag" }, { id: "DENGM", nombre: "Dengue IgM" },
                { id: "EBVG", nombre: "Epstein-Barr VCA IgG" }, { id: "EBVM", nombre: "Epstein-Barr VCA IgM" }, { id: "HPI", nombre: "Helicobacter pylori IgG" },
                { id: "COVG", nombre: "SARS-CoV-2 IgG" }, { id: "COVAG", nombre: "SARS-CoV-2 Antígeno" }
            ],
            marcadores: [
                { id: "PSA", nombre: "PSA Total" }, { id: "PSAL", nombre: "PSA Libre" }, { id: "CEA", nombre: "Antígeno Carcinoembrionario" },
                { id: "CA125", nombre: "CA 125 (Ovario)" }, { id: "CA153", nombre: "CA 15-3 (Mama)" }, { id: "CA199", nombre: "CA 19-9 (GI/Páncreas)" },
                { id: "AFP", nombre: "Alfa-fetoproteína" }, { id: "B2M", nombre: "Beta-2 Microglobulina" }, { id: "HE4", nombre: "HE4 (Ovario)" },
                { id: "CYFRA", nombre: "CYFRA 21-1 (Pulmón)" }, { id: "NSE", nombre: "Enolasa Específica" }, { id: "SCC", nombre: "Antígeno Células Esc." }
            ],
            hematologia: [
                { id: "HEMO", nombre: "Hemograma Completo" }, { id: "VSG", nombre: "Velocidad de Sedimentación" }, { id: "RET", nombre: "Reticulocitos" },
                { id: "GS", nombre: "Grupo y Factor Rh" }, { id: "PLA", nombre: "Recuento de Plaquetas" }, { id: "LEU", nombre: "Fórmula Leucocitaria" },
                { id: "HGB", nombre: "Hemoglobina" }, { id: "HCT", nombre: "Hematocrito" }, { id: "VCM", nombre: "Índices Eritrocitarios" }
            ],
            coagulacion: [
                { id: "TP", nombre: "Tiempo de Protrombina" }, { id: "INR", nombre: "INR" }, { id: "TTPA", nombre: "Tiempo de Tromboplastina (APTT)" }, 
                { id: "FIB", nombre: "Fibrinógeno" }, { id: "TT", nombre: "Tiempo de Trombina" }, { id: "DDIM", nombre: "Dímero D" }, 
                { id: "VWFAG", nombre: "von Willebrand (Ag)" }, { id: "VWFRC", nombre: "von Willebrand (RCo)" }, { id: "FVIII", nombre: "Factor VIII" },
                { id: "FIX", nombre: "Factor IX" }, { id: "FVII", nombre: "Factor VII" }, { id: "FV", nombre: "Factor V" },
                { id: "FX", nombre: "Factor X" }, { id: "FXI", nombre: "Factor XI" }, { id: "FXII", nombre: "Factor XII" },
                { id: "PC", nombre: "Proteína C (Actividad)" }, { id: "PS", nombre: "Proteína S (Libre)" }, { id: "ATIII", nombre: "Antitrombina III" },
                { id: "LA1", nombre: "Anticoagulante Lúpico" }, { id: "AXA", nombre: "Anti-Factor Xa" }, { id: "PLAS", nombre: "Plasminógeno" },
                { id: "ACA", nombre: "Anticuerpos Anticardiolipina" }
            ]
        };

        const nombresCategorias = { quimica: "🧪 Química Sanguínea, TDM y Drogas", inmunologia: "🧬 Inmunología y Hormonas", infecciosas: "🦠 Serología e Infecciosas", marcadores: "🎗️ Marcadores Tumorales", hematologia: "🩸 Hematología", coagulacion: "⏱️ Coagulación y Factores Especiales" };

        let pruebasSeleccionadas = new Set();

        function abrirModal(categoria) {
            document.getElementById('modal-titulo').innerText = nombresCategorias[categoria];
            const grid = document.getElementById('modal-grid');
            grid.innerHTML = ""; 

            catalogoPruebas[categoria].forEach(prueba => {
                const isSelected = pruebasSeleccionadas.has(prueba.id);
                const card = document.createElement('div');
                card.className = `test-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => togglePrueba(card, prueba.id);
                card.innerHTML = `<div class="test-code">${prueba.id}</div><div class="test-name">${prueba.nombre}</div>`;
                grid.appendChild(card);
            });

            document.getElementById('modal-pruebas').style.display = 'flex';
        }

        function togglePrueba(cardElement, idPrueba) {
            if (pruebasSeleccionadas.has(idPrueba)) {
                pruebasSeleccionadas.delete(idPrueba);
                cardElement.classList.remove('selected');
            } else {
                pruebasSeleccionadas.add(idPrueba);
                cardElement.classList.add('selected');
            }
        }

        function cerrarModal() {
            document.getElementById('modal-pruebas').style.display = 'none';
            actualizarResumenSeleccion();
        }

        function actualizarResumenSeleccion() {
            const contenedor = document.getElementById('resumen-seleccion');
            contenedor.innerHTML = "";
            pruebasSeleccionadas.forEach(id => {
                contenedor.innerHTML += `<span class="badge-prueba">${id} ✖</span>`;
            });
        }

        function buscarPaciente() {
            const ci = document.getElementById('ci').value.trim();
            if(!ci) { alert("Ingrese un CI."); return; }

            db.ref("pacientes/" + ci).once("value").then((snapshot) => {
                if (snapshot.exists()) {
                    const datos = snapshot.val();
                    document.getElementById('nombre').value = datos.nombre;
                    document.getElementById('fecha_nac').value = datos.fecha_nac;
                    document.getElementById('genero').value = datos.genero;
                    buscarHistorial(ci);
                } else {
                    alert("Paciente nuevo. Complete los datos.");
                    document.getElementById('nombre').value = "";
                    document.getElementById('panel-historial').style.display = "none";
                }
            });
        }

        function buscarHistorial(ci) {
            const tabla = document.getElementById('tabla-historial');
            tabla.innerHTML = ""; 
            db.ref("ordenes_pendientes").orderByChild("ci_paciente").equalTo(ci).once("value", (snapshot) => {
                if(snapshot.exists()) {
                    document.getElementById('panel-historial').style.display = "block";
                    snapshot.forEach((hijo) => {
                        const orden = hijo.val();
                        const fecha = new Date(orden.fecha_creacion).toLocaleDateString();
                        const pruebas = orden.examenes ? orden.examenes.join(", ") : "N/A";
                        const fila = `<tr><td>${fecha}</td><td>${orden.medico || 'N/A'}</td><td><strong>${pruebas}</strong></td><td><span style="color: var(--aes-blue); font-weight: bold;">${orden.estado}</span></td></tr>`;
                        tabla.insertAdjacentHTML("afterbegin", fila);
                    });
                }
            });
        }

        function generarOrden() {
            const ci = document.getElementById('ci').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const medico = document.getElementById('medico').value.trim();
            
            if(!ci || !nombre) { alert("El CI y el Nombre son obligatorios."); return; }
            if(pruebasSeleccionadas.size === 0) { alert("Debe seleccionar al menos un examen de los paneles."); return; }

            const datosPaciente = { nombre: nombre, fecha_nac: document.getElementById('fecha_nac').value, genero: document.getElementById('genero').value, ultima_visita: new Date().toISOString() };
            db.ref("pacientes/" + ci).set(datosPaciente);

            const examenesArray = Array.from(pruebasSeleccionadas);
            const fechaHoy = new Date().toISOString().slice(2,10).replace(/-/g,"");
            const random = Math.floor(1000 + Math.random() * 9000);
            const idMuestra = `${fechaHoy}${random}`;

            const datosOrden = {
                id_muestra: idMuestra, ci_paciente: ci, nombre_paciente: nombre, medico: medico,
                examenes: examenesArray, prioridad: document.getElementById('prioridad').value,
                estado: "Pendiente", fecha_creacion: new Date().toISOString()
            };

            db.ref("ordenes_pendientes/" + idMuestra).set(datosOrden).then(() => {
                document.getElementById('lbl-paciente-etiqueta').innerText = `${nombre} | CI: ${ci}\nMédico: ${medico || 'N/A'} | Exámenes: ${examenesArray.join(", ")}`;
                document.getElementById('barcode-panel').style.display = "block";
                
                JsBarcode("#barcode", idMuestra, { format: "CODE128", lineColor: "#000000", width: 2, height: 50, displayValue: true, fontSize: 16, fontOptions: "bold" });

                pruebasSeleccionadas.clear();
                actualizarResumenSeleccion();
                document.getElementById('medico').value = "";
                buscarHistorial(ci);
            });
        }
    </script>
</body>
</html>
